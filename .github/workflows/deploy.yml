# แก้โค้ดใน src/ บน GitHub → ทดสอบ → ส่งขึ้น Apps Script → อัปเดตเว็บ (ลิงก์ /exec เดิม)
name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', '.github/workflows/deploy.yml']
  workflow_dispatch:        # กดรันเองได้ที่แท็บ Actions

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ทดสอบก่อน deploy
        run: |
          node test/t9.js  > /dev/null
          node test/t12.js > /dev/null
          node test/t13.js > /dev/null
          node test/t14.js > /dev/null
          node -e "new Function(require('fs').readFileSync('src/Code.gs','utf8'))"
          echo "ผ่านทุกชุด"

      - name: ติดตั้ง clasp
        run: npm install -g @google/clasp@2.4.2

      - name: ใส่ค่าล็อกอินจาก Secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then echo "ยังไม่ได้ตั้ง Secrets CLASPRC_JSON / SCRIPT_ID"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json

      - name: ส่งโค้ดขึ้น Apps Script
        run: clasp push --force

      - name: อัปเดตเว็บ (New version ของ deployment เดิม)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then echo "ยังไม่ได้ตั้ง Secret DEPLOYMENT_ID"; exit 1; fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: ลบค่าล็อกอิน
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
